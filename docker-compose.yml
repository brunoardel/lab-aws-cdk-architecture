services:
  floci:
    image: floci/floci:latest
    container_name: arqlab-floci
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,stepfunctions,eventbridge,lambda
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - floci_data:/data

  floci-ui:
    image: floci/floci-ui:latest
    container_name: arqlab-floci-ui
    ports:
      - "4500:4500"
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
    depends_on:
      - floci

volumes:
  floci_data:
